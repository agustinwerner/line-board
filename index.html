const board = document.querySelector("#board");
let filter = "NFL";
function show(game) {
  const q = document.querySelector("#q").value.trim().toLowerCase();
  const text = `${game.away} ${game.home} ${game.favorite}`.toLowerCase();
  if (q && !text.includes(q)) return false;
  if (filter === "All") return true;
  if (filter === "SEC/ACC") return game.sec_acc;
  return game.league === filter;
}
function rank(game) {
  if (game.favorite_fpi_rank == null) return "";
  const dog = game.dog_fpi_rank == null ? "unranked" : `#${game.dog_fpi_rank}`;
  return ` · FPI #${game.favorite_fpi_rank} vs ${dog}`;
}
function draw() {
  const games = DATA.games.filter(show).sort((a, b) => a.kickoff.localeCompare(b.kickoff));
  board.innerHTML = games.map(game => `<article>
    <time>${game.when}</time>
    <div>
      <div class="match">${game.away} at ${game.home}</div>
      <div class="fav">${game.favorite}</div>
      <div class="meta">${game.spread}${rank(game)}${game.old_model_disagrees ? '<div class="tag">Old score model disagreed. Ignored.</div>' : ""}</div>
    </div>
    <div class="pct"><b>${game.favorite_win}%</b><span class="meta">to win</span></div>
  </article>`).join("") || "<p>No games match.</p>";
}
document.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
  filter = button.dataset.filter;
  document.querySelectorAll("button").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
  draw();
}));
document.querySelector("#q").addEventListener("input", draw);
draw();
</script>
