<html lang="en">

<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>Line Board</title>
<style>
  :root {
    --bg: #f2f2f7;
    --ink: #000000;
    --muted: rgba(60, 60, 67, 0.6);
    --secondary: rgba(60, 60, 67, 0.8);
    --blue: #007aff;
    --white: #ffffff;
    --group: #ffffff;
    --hairline: rgba(60, 60, 67, 0.29);
    --segment: rgba(118, 118, 128, 0.12);
    --nav: rgba(249, 249, 249, 0.94);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #ffffff;
      --muted: rgba(235, 235, 245, 0.6);
      --secondary: rgba(235, 235, 245, 0.7);
      --blue: #0a84ff;
      --white: #1c1c1e;
      --group: #1c1c1e;
      --hairline: rgba(84, 84, 88, 0.65);
      --segment: rgba(118, 118, 128, 0.24);
      --nav: rgba(28, 28, 30, 0.88);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--nav);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.33px solid var(--hairline);
  }
  .nav-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: calc(6px + var(--safe-top)) 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
  }
  .mark {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.43px;
  }
  .count {
    font-size: 15px;
    font-weight: 400;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  header {
    max-width: 980px;
    margin: 0 auto;
    padding: 8px 20px 12px;
  }
  h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: 0.37px;
  }
  .lede {
    margin: 6px 0 0;
    max-width: 34em;
    font-size: 15px;
    line-height: 1.33;
    letter-spacing: -0.24px;
    color: var(--secondary);
  }
  .toolbar {
    max-width: 980px;
    margin: 0 auto;
    padding: 4px 20px 4px;
    display: grid;
    gap: 10px;
  }
  .segmented {
    display: flex;
    width: 100%;
    padding: 2px;
    border-radius: 9px;
    background: var(--segment);
  }
  .segmented button {
    flex: 1;
    min-height: 32px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-weight: 500;
    letter-spacing: -0.08px;
    border-radius: 7px;
    padding: 6px 8px;
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--white);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
  }
  .search { position: relative; }
  .search input {
    width: 100%;
    height: 36px;
    border: 0;
    border-radius: 10px;
    background: var(--segment);
    color: var(--ink);
    padding: 0 12px 0 32px;
    font: 17px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    letter-spacing: -0.43px;
    outline: none;
    -webkit-appearance: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search svg {
    position: absolute;
    left: 9px;
    top: 10px;
    width: 16px;
    height: 16px;
    color: var(--muted);
    pointer-events: none;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 6px 20px 80px;
  }
  section { margin-top: 22px; }
  .day {
    margin: 0 16px 7px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: -0.08px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .group {
    background: var(--group);
    border-radius: 10px;
    overflow: hidden;
  }
  article {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    min-height: 72px;
  }
  article + article {
    position: relative;
  }
  article + article::before {
    content: "";
    position: absolute;
    left: 16px;
    right: 0;
    top: 0;
    height: 0.33px;
    background: var(--hairline);
  }
  .matchup {
    margin: 0 0 2px;
    font-size: 13px;
    letter-spacing: -0.08px;
    color: var(--muted);
  }
  .favorite {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.45px;
  }
  .meta {
    margin: 3px 0 0;
    font-size: 13px;
    line-height: 1.23;
    letter-spacing: -0.08px;
    color: var(--secondary);
  }
  .note {
    margin: 3px 0 0;
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--muted);
  }
  .pct {
    text-align: right;
    min-width: 78px;
  }
  .pct b {
    display: block;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.45px;
    font-variant-numeric: tabular-nums;
    color: var(--blue);
  }
  .pct span {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--muted);
  }
  .empty {
    margin: 48px 16px;
    color: var(--muted);
    font-size: 17px;
  }
  footer {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 36px 48px;
    font-size: 13px;
    line-height: 1.23;
    letter-spacing: -0.08px;
    color: var(--muted);
  }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }
  @media (max-width: 640px) {
    h1 { font-size: 34px; }
    article { padding: 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

const board = document.querySelector("#board");
const count = document.querySelector("#count");
let filter = "NFL";

function show(game) {
  const q = document.querySelector("#q").value.trim().toLowerCase();
  const text = `${game.away} ${game.home} ${game.favorite} ${game.underdog}`.toLowerCase();
  if (q && !text.includes(q)) return false;
  if (filter === "All") return true;
  if (filter === "SEC/ACC") return game.sec_acc;
  return game.league === filter;
}

function dayLabel(iso) {
  return new Date(iso).toLocaleDateString("en-US", {
    weekday: "long", month: "long", day: "numeric", timeZone: "America/New_York"
  });
}

function kickTime(iso) {
  return new Date(iso).toLocaleTimeString("en-US", {
    hour: "numeric", minute: "2-digit", timeZone: "America/New_York"
  });
}

function rank(game) {
  if (game.favorite_fpi_rank == null) return "";
  const dog = game.dog_fpi_rank == null ? "unranked" : `#${game.dog_fpi_rank}`;
  return ` · FPI #${game.favorite_fpi_rank} vs ${dog}`;
}

function draw() {
  const games = DATA.games.filter(show).sort((a, b) => a.kickoff.localeCompare(b.kickoff));
  count.textContent = `${games.length}`;
  if (!games.length) {
    board.innerHTML = `<p class="empty">No games match.</p>`;
    return;
  }
  const groups = [];
  for (const game of games) {
    const label = dayLabel(game.kickoff);
    if (!groups.length || groups[groups.length - 1].label !== label) {
      groups.push({ label, games: [] });
    }
    groups[groups.length - 1].games.push(game);
  }
  board.innerHTML = groups.map(group => `
    <section>
      <h2 class="day">${group.label}</h2>
      <div class="group">${group.games.map(game => `
        <article>
          <div>
            <p class="matchup">${game.away} at ${game.home} · ${kickTime(game.kickoff)}</p>
            <h3 class="favorite">${game.favorite}</h3>
            <p class="meta">${game.spread}${rank(game)}</p>
            ${game.old_model_disagrees ? `<p class="note">Old score model disagreed. Ignored.</p>` : ""}
          </div>
          <div class="pct">
            <b>${Number(game.favorite_win).toFixed(1)}%</b>
            <span>to win</span>
          </div>
        </article>`).join("")}</div>
    </section>
  `).join("");
}

document.querySelectorAll(".segmented button").forEach(button => button.addEventListener("click", () => {
  filter = button.dataset.filter;
  document.querySelectorAll(".segmented button").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
  draw();
}));
document.querySelector("#q").addEventListener("input", draw);
draw();
</script>
